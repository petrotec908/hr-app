<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحضور والانصراف</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4e78">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:420px;padding:20px}
  h1{font-size:22px;text-align:center;margin:10px 0 20px}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  label{display:block;margin:12px 0 6px;font-size:14px;color:#475569}
  input{width:100%;padding:14px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px}
  button{width:100%;padding:16px;font-size:18px;border:0;border-radius:12px;color:#fff;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5}
  .primary{background:#1f4e78}
  .in{background:#16a34a}
  .out{background:#dc2626}
  .link{background:none;color:#64748b;font-size:14px;margin-top:6px}
  .hello{text-align:center;font-size:18px;margin-bottom:6px}
  .clock{text-align:center;font-size:34px;font-weight:bold;margin:6px 0 4px}
  .date{text-align:center;color:#64748b;margin-bottom:10px}
  #msg{margin-top:16px;padding:12px;border-radius:10px;text-align:center;display:none;font-size:15px}
  .ok{background:#dcfce7;color:#166534}
  .err{background:#fee2e2;color:#991b1b}
  .info{background:#e0f2fe;color:#075985}
  .hidden{display:none}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{margin:0;padding:10px;font-size:14px;background:#e2e8f0;color:#334155}
  .tabs button.on{background:#1f4e78;color:#fff}
  select,textarea{width:100%;padding:14px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;font-family:inherit}
  .item{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.7}
  .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:#fef9c3;color:#854d0e}
  .badge.yes{background:#dcfce7;color:#166534}
  .badge.no{background:#fee2e2;color:#991b1b}
  .row{display:flex;gap:8px}.row button{margin-top:8px;padding:10px;font-size:15px}
</style>
</head>
<body>
<div class="app">
  <h1>نظام الحضور والانصراف</h1>

  <!-- شاشة الدخول -->
  <div class="card" id="loginView">
    <label>كود الموظف</label>
    <input id="empId" placeholder="مثال: E001" autocapitalize="characters">
    <label>الرقم السري</label>
    <input id="empPin" type="password" inputmode="numeric" placeholder="••••">
    <button class="primary" id="loginBtn">دخول</button>
  </div>

  <!-- شاشة التسجيل -->
  <div class="card hidden" id="mainView">
    <div class="hello" id="hello"></div>
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
    <div class="tabs">
      <button class="on" data-tab="punchTab">الحضور</button>
      <button data-tab="reqTab">طلباتي</button>
      <button data-tab="missionTab">مأمورية</button>
      <button data-tab="mgrTab" id="mgrTabBtn" class="hidden">الموافقات</button>
    </div>

    <div id="punchTab" class="tab">
      <button class="in" id="inBtn">تسجيل حضور</button>
      <button class="out" id="outBtn">تسجيل انصراف</button>
    </div>

    <div id="reqTab" class="tab hidden">
      <label>نوع الطلب</label>
      <select id="rType"><option>إجازة</option><option>إذن تأخير</option><option>إذن خروج</option></select>
      <label>من تاريخ</label><input id="rFrom" type="date">
      <label>إلى تاريخ (للإجازة)</label><input id="rTo" type="date">
      <label>السبب</label><textarea id="rReason" rows="2"></textarea>
      <button class="primary" id="rSend">إرسال الطلب</button>
      <div id="myList"></div>
    </div>

    <div id="missionTab" class="tab hidden">
      <div class="item">سجّل المأمورية قبل ما تخرج، واليوم ده هيتحسبلك حضور.</div>
      <label>تاريخ المأمورية</label><input id="mDate" type="date">
      <label>اسم اللي كلّفك بالمأمورية</label><input id="mBy" placeholder="مثال: م. أحمد">
      <label>الجهة أو الغرض (اختياري)</label><textarea id="mDetails" rows="2"></textarea>
      <button class="primary" id="mSend">تسجيل المأمورية</button>
      <div id="mList"></div>
    </div>

    <div id="mgrTab" class="tab hidden">
      <button class="primary" id="mgrRefresh">تحديث الطلبات المعلّقة</button>
      <div id="mgrList"></div>
    </div>

    <button class="link" id="logoutBtn">تسجيل خروج من التطبيق</button>
  </div>

  <div id="msg"></div>
</div>

<script>
// رابط الباك إند (Apps Script)
const API = "https://script.google.com/macros/s/AKfycbziR7dPHd0qvABE3y7pvFvYhNMyILCXYC8oYe5hiR6ueNk4n48ocWcMF3ZWXCdaEope/exec";

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

// رقم مميز للجهاز (بيتربط بالموظف أول مرة)
let device = store.get("device");
if (!device) {
  device = "D" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  store.set("device", device);
}

let session = null;

function show(text, type){
  const m = $("msg");
  m.textContent = text;
  m.className = type;
  m.style.display = "block";
}
function hideMsg(){ $("msg").style.display = "none"; }

async function call(action, data){
  // text/plain عشان نتجنب مشاكل CORS مع Apps Script
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, device, ...data })
  });
  return res.json();
}

function getLocation(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("المتصفح مش بيدعم تحديد الموقع"));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => reject(new Error(e.code === 1
        ? "لازم تسمح للتطبيق بالوصول للموقع (Location) من إعدادات المتصفح"
        : "مقدرتش أحدد موقعك، شغّل الـ GPS وجرب تاني")),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

function openMain(){
  $("mgrTabBtn").classList.toggle("hidden", session.role !== "Manager");
  $("loginView").classList.add("hidden");
  $("mainView").classList.remove("hidden");
  $("hello").textContent = "أهلًا " + session.name;
  hideMsg();
}

$("loginBtn").onclick = async () => {
  const id = $("empId").value.trim().toUpperCase();
  const pin = $("empPin").value.trim();
  if (!id || !pin) return show("اكتب الكود والرقم السري", "err");
  $("loginBtn").disabled = true;
  show("جاري الدخول...", "info");
  try {
    const r = await call("login", { id, pin });
    if (!r.ok) throw new Error(r.error);
    session = { id, pin, name: r.name, role: r.role };
    store.set("session", JSON.stringify(session));
    openMain();
  } catch (e) {
    show(e.message || "حصل خطأ، جرب تاني", "err");
  } finally {
    $("loginBtn").disabled = false;
  }
};

// ===== البصمة (بصمة أو قفل شاشة الموبايل) =====
const REQUIRE_BIOMETRIC = true;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function verifyBio(){
  if (!REQUIRE_BIOMETRIC) return;
  if (!window.PublicKeyCredential) throw new Error("موبايلك أو المتصفح مش بيدعم البصمة");
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const key = "cred_" + session.id;
  const saved = store.get(key);
  try {
    if (!saved) {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge, rp: { name: "HR App" },
        user: { id: new TextEncoder().encode(session.id), name: session.id, displayName: session.name },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required", residentKey: "discouraged" },
        timeout: 60000 } });
      store.set(key, b64(cred.rawId));
    } else {
      await navigator.credentials.get({ publicKey: {
        challenge, allowCredentials: [{ type: "public-key", id: unb64(saved) }],
        userVerification: "required", timeout: 60000 } });
    }
  } catch (e) {
    throw new Error("لازم تأكد بالبصمة أو بقفل الشاشة عشان تسجّل. ولو الموبايل مفيهوش بصمة مفعّلة، فعّلها من إعدادات الموبايل");
  }
}

async function punch(type){
  const btns = [$("inBtn"), $("outBtn")];
  btns.forEach(b => b.disabled = true);
  try {
    show("أكّد بالبصمة...", "info");
    await verifyBio();
    show("جاري تحديد موقعك...", "info");
    const pos = await getLocation();
    show("جاري التسجيل...", "info");
    const r = await call("punch", { id: session.id, pin: session.pin, type, lat: pos.lat, lng: pos.lng });
    if (r.ok) {
      show((type === "In" ? "تم تسجيل الحضور" : "تم تسجيل الانصراف") + " ✅ (بعدك عن الشركة " + r.distance + " متر)", "ok");
    } else {
      show((r.error || "فشل التسجيل") + (r.distance !== undefined ? " (بعدك " + r.distance + " متر)" : ""), "err");
    }
  } catch (e) {
    show(e.message || "حصل خطأ، جرب تاني", "err");
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}
$("inBtn").onclick = () => punch("In");
$("outBtn").onclick = () => punch("Out");

$("logoutBtn").onclick = () => {
  store.del("session");
  session = null;
  $("mainView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("empPin").value = "";
  hideMsg();
};

// التبويبات
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("hidden", t.id !== b.dataset.tab));
  hideMsg();
  if (b.dataset.tab === "reqTab") loadMine();
  if (b.dataset.tab === "mgrTab") loadPending();
  if (b.dataset.tab === "missionTab") loadMissions();
});

const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmtDate(v){
  if (!v) return "";
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleDateString("en-CA");
}
function badge(st){
  const c = st === "موافق" ? "yes" : st === "مرفوض" ? "no" : "";
  return '<span class="badge ' + c + '">' + esc(st) + '</span>';
}
function dates(r){
  const a = fmtDate(r.FromDate), b = fmtDate(r.ToDate);
  return a + (b && b !== a ? " ← " + b : "");
}

$("rSend").onclick = async () => {
  const from = $("rFrom").value, to = $("rTo").value || from, reason = $("rReason").value.trim();
  if (!from) return show("اختار التاريخ", "err");
  if (!reason) return show("اكتب السبب", "err");
  $("rSend").disabled = true; show("جاري الإرسال...", "info");
  try {
    const r = await call("submitRequest", { id: session.id, pin: session.pin, type: $("rType").value, from, to, reason });
    if (!r.ok) throw new Error(r.error);
    show("تم إرسال الطلب ✅", "ok");
    $("rReason").value = ""; loadMine();
  } catch (e) { show(e.message || "حصل خطأ", "err"); }
  finally { $("rSend").disabled = false; }
};

async function loadMine(){
  try {
    const r = await call("myRequests", { id: session.id, pin: session.pin });
    if (!r.ok) throw new Error(r.error);
    $("myList").innerHTML = r.list.length ? r.list.map(x =>
      '<div class="item"><b>' + esc(x.Type) + '</b> ' + badge(x.Status) + '<br>' + dates(x) + '<br>' + esc(x.Reason) + '</div>'
    ).join("") : '<div class="item">مفيش طلبات لسه</div>';
  } catch (e) { show(e.message || "حصل خطأ", "err"); }
}

async function loadPending(){
  show("جاري التحميل...", "info");
  try {
    const r = await call("pendingRequests", { id: session.id, pin: session.pin });
    if (!r.ok) throw new Error(r.error);
    hideMsg();
    $("mgrList").innerHTML = r.list.length ? r.list.map(x =>
      '<div class="item"><b>' + esc(x.EmployeeID) + '</b> - ' + esc(x.Type) + '<br>' + dates(x) + '<br>' + esc(x.Reason) +
      '<div class="row"><button class="in" onclick="decide(\'' + x.RequestID + '\',\'موافق\')">موافقة</button>' +
      '<button class="out" onclick="decide(\'' + x.RequestID + '\',\'مرفوض\')">رفض</button></div></div>'
    ).join("") : '<div class="item">مفيش طلبات معلّقة</div>';
  } catch (e) { show(e.message || "حصل خطأ", "err"); }
}
$("mgrRefresh").onclick = loadPending;

async function decide(requestId, decision){
  try {
    const r = await call("decideRequest", { id: session.id, pin: session.pin, requestId, decision });
    if (!r.ok) throw new Error(r.error);
    show("تم: " + decision, "ok"); loadPending();
  } catch (e) { show(e.message || "حصل خطأ", "err"); }
}

// ===== المأموريات =====
$("mDate").value = new Date().toLocaleDateString("en-CA");
$("mSend").onclick = async () => {
  const date = $("mDate").value, assignedBy = $("mBy").value.trim(), details = $("mDetails").value.trim();
  if (!date) return show("اختار التاريخ", "err");
  if (!assignedBy) return show("اكتب اسم اللي كلّفك", "err");
  $("mSend").disabled = true; show("جاري التسجيل...", "info");
  try {
    const r = await call("mission", { id: session.id, pin: session.pin, date, assignedBy, details });
    if (!r.ok) throw new Error(r.error);
    show("تم تسجيل المأمورية ✅ واليوم اتحسبلك حضور", "ok");
    $("mBy").value = ""; $("mDetails").value = ""; loadMissions();
  } catch (e) { show(e.message || "حصل خطأ", "err"); }
  finally { $("mSend").disabled = false; }
};
async function loadMissions(){
  try {
    const r = await call("myMissions", { id: session.id, pin: session.pin });
    if (!r.ok) throw new Error(r.error);
    $("mList").innerHTML = r.list.length ? r.list.map(x =>
      '<div class="item"><b>' + fmtDate(x.Date) + '</b><br>كلّفه: ' + esc(x.AssignedBy) + (x.Details ? '<br>' + esc(x.Details) : '') + '</div>'
    ).join("") : '<div class="item">مفيش مأموريات لسه</div>';
  } catch (e) { show(e.message || "حصل خطأ", "err"); }
}

// الساعة والتاريخ
function tick(){
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" });
}
tick(); setInterval(tick, 10000);

// لو كان داخل قبل كده
try {
  const saved = JSON.parse(store.get("session") || "null");
  if (saved) { session = saved; openMain(); }
} catch (e) {}
</script>
</body>
</html>
